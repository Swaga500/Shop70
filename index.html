            /* Стили для слайдера картинок */

        .slider-track img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.2s; }

        /* Стили для кнопки поддержки и всплывающего окна */

        .support-container:hover .support-tooltip { display: block; }

    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-counter').innerText = count;
        }
    </script>

    <script>
        function moveSlide(button, direction) {
            const wrapper = button.closest('.slider-wrapper');
            const track = wrapper.querySelector('.slider-track');
            const slides = track.querySelectorAll('img');
            const slideWidth = slides[0].clientWidth;
            
            // Получаем текущий сдвиг или ставим 0
            let currentTrackX = parseInt(track.style.transform.replace(/[^\d-]/g, '')) || 0;
            let currentIndex = Math.abs(currentTrackX / slideWidth);
            
            // Считаем новый индекс картинки
            currentIndex += direction;
            
            // Зацикливаем слайдер (после последней идет первая и наоборот)
            if (currentIndex >= slides.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = slides.length - 1;
            
            // Двигаем ленту с картинками
            track.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
        }
    </script>
